reqwest.workspace = true
rand.workspace = true
chacha20poly1305 = "0.11.0"
keyring = "4.2.0"
base64 = "0.23.1"
regex = "1.13.1"
aho-corasick = "1.1.5"
zeroize = "1.9.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
serde_json.workspace = true
