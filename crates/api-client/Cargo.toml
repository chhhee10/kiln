[package]
name = "kiln-api-client"
description = "Typed HTTP + WebSocket client for the Kiln daemon. Native (TUI) and wasm (desktop/Android app)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kiln-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Location", "Window"] }
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true }
