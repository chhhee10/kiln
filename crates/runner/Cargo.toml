[package]
name = "kiln-runner"
description = "In-container Kiln runner: drives a harness, spools events, talks to the daemon socket and serves the memory MCP proxy."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kiln_runner"
path = "src/lib.rs"

[[bin]]
name = "kiln-runner"
path = "src/main.rs"

[dependencies]
kiln-types.workspace = true
kiln-harness.workspace = true
chrono.workspace = true
clap.workspace = true
libc = "0.2.191"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
kiln-sandbox.workspace = true
