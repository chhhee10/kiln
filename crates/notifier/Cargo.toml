[package]
name = "kiln-notifier"
description = "Kiln notifications: persisted in-app cards, event-bus fan-out and UnifiedPush/ntfy delivery with per-channel preferences."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kiln-types.workspace = true
kiln-store.workspace = true
kiln-events.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# Web Push message encryption (RFC 8291, aes128gcm).
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "std"] }
aes-gcm = { version = "0.10.3", features = ["getrandom"] }
hkdf = "0.12.4"
sha2-10 = { package = "sha2", version = "0.10.9" }
base64 = "0.23.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
