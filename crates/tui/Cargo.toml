[package]
name = "kiln-tui"
description = "Kiln terminal client (`kiln`): keyboard-first Ratatui UI for the Kiln daemon."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kiln"
path = "src/main.rs"

[lib]
name = "kiln_tui"
path = "src/lib.rs"

[dependencies]
kiln-types.workspace = true
kiln-api-client.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
futures.workspace = true
clap.workspace = true
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
qrcode = { version = "0.14.1", default-features = false }
toml = "0.8.20"
unicode-width = "0.2.0"

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
