[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/api-client",
    "crates/store",
    "crates/auth",
    "crates/vault",
    "crates/events",
    "crates/scheduler",
    "crates/sandbox",
    "crates/harness",
    "crates/runner",
    "crates/gitops",
    "crates/memory",
    "crates/planner",
    "crates/notifier",
    "crates/daemon",
    "crates/tui",
    "app",
]
# app/src-tauri needs WebKitGTK system libraries; build it explicitly with `cargo tauri build`.
exclude = ["app/src-tauri"]
default-members = [
    "crates/types",
    "crates/api-client",
    "crates/store",
    "crates/auth",
    "crates/vault",
    "crates/events",
    "crates/scheduler",
    "crates/sandbox",
    "crates/harness",
    "crates/runner",
    "crates/gitops",
    "crates/memory",
    "crates/planner",
    "crates/notifier",
    "crates/daemon",
    "crates/tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/chhhee10/kiln"

[workspace.dependencies]
kiln-types = { path = "crates/types" }
kiln-api-client = { path = "crates/api-client" }
kiln-store = { path = "crates/store" }
kiln-auth = { path = "crates/auth" }
kiln-vault = { path = "crates/vault" }
kiln-events = { path = "crates/events" }
kiln-scheduler = { path = "crates/scheduler" }
kiln-sandbox = { path = "crates/sandbox" }
kiln-harness = { path = "crates/harness" }
kiln-runner = { path = "crates/runner" }
kiln-gitops = { path = "crates/gitops" }
kiln-memory = { path = "crates/memory" }
kiln-planner = { path = "crates/planner" }
kiln-notifier = { path = "crates/notifier" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
