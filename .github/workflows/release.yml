name: Release

# Push a tag like v0.1.0 to build binaries, publish the worker image to
# ghcr.io/chhhee10/kiln-worker and create a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - run: trunk build --release
        working-directory: app
      - run: cargo build --release --target ${{ matrix.target }} -p kiln-daemon -p kiln-tui -p kiln-runner
      - name: Package
        run: |
          name=kiln-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$name/web"
          for b in kilnd kiln kiln-runner; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          cp -r app/dist/. "$name/web/"
          cp README.md LICENSE-MIT LICENSE-APACHE config/kiln.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: kiln-*.tar.gz

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/chhhee10/kiln-worker:${{ github.ref_name }}
            ghcr.io/chhhee10/kiln-worker:latest
          labels: org.opencontainers.image.source=https://github.com/chhhee10/kiln
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: kiln-*.tar.gz
          generate_release_notes: true
